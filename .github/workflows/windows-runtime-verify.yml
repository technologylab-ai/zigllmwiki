name: Windows runtime verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zig-wiki-windows-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-windows:
    name: Windows runtime (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            os_arch: X64
            pe_machine: "8664"
          - arch: aarch64
            runner: windows-11-arm
            os_arch: Arm64
            pe_machine: "aa64"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ZIG_PLATFORM: ${{ matrix.arch }}-windows
      EXPECTED_OS_ARCH: ${{ matrix.os_arch }}
      EXPECTED_PE_MACHINE: ${{ matrix.pe_machine }}

    steps:
      - name: Prepare the out-of-tree evidence packet
        shell: pwsh
        run: |
          $packet = Join-Path $env:RUNNER_TEMP "zig-wiki-windows-runtime"
          New-Item -ItemType Directory -Force -Path $packet | Out-Null
          "REVIEW_PACKET=$packet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the exact Zig baseline from the official index
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $baseline = (Get-Content -Raw -Path ".zig-version").Trim()
          if ($baseline -notmatch '^\d+\.\d+\.\d+$') {
            throw ".zig-version is not an exact stable version: $baseline"
          }

          $headers = @{ "User-Agent" = "zigllmwiki-windows-verification/1" }
          $indexUrl = "https://ziglang.org/download/index.json"
          $index = Invoke-RestMethod -Uri $indexUrl -Headers $headers -TimeoutSec 30
          $releaseProperty = $index.PSObject.Properties[$baseline]
          if ($null -eq $releaseProperty) {
            throw "official download index has no release '$baseline'"
          }
          $artifactProperty = $releaseProperty.Value.PSObject.Properties[$env:ZIG_PLATFORM]
          if ($null -eq $artifactProperty) {
            throw "release '$baseline' has no $env:ZIG_PLATFORM artifact"
          }
          $artifact = $artifactProperty.Value
          $url = [string] $artifact.tarball
          $expectedSha256 = ([string] $artifact.shasum).ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($url) -or
              $expectedSha256 -notmatch '^[0-9a-f]{64}$') {
            throw "official artifact metadata omitted a valid tarball or shasum"
          }

          $archive = Join-Path $env:RUNNER_TEMP "zig-$baseline-windows.zip"
          Invoke-WebRequest -Uri $url -Headers $headers -TimeoutSec 180 -OutFile $archive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actualSha256 -cne $expectedSha256) {
            throw "Zig archive digest mismatch: expected $expectedSha256, got $actualSha256"
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP "zig-install"
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot -Force
          $zigExecutables = @(
            Get-ChildItem -Path $extractRoot -Filter "zig.exe" -File -Recurse
          )
          if ($zigExecutables.Count -ne 1) {
            throw "expected exactly one zig.exe, found $($zigExecutables.Count)"
          }
          $zigBytes = [IO.File]::ReadAllBytes($zigExecutables[0].FullName)
          $peOffset = [BitConverter]::ToInt32($zigBytes, 0x3c)
          if ([BitConverter]::ToUInt16($zigBytes, 0) -ne 0x5a4d -or
              [BitConverter]::ToUInt32($zigBytes, $peOffset) -ne 0x4550) {
            throw "zig.exe is not a PE executable"
          }
          $peMachine = [BitConverter]::ToUInt16($zigBytes, $peOffset + 4).ToString("x4")
          if ($peMachine -cne $env:EXPECTED_PE_MACHINE) {
            throw "expected native compiler PE machine $env:EXPECTED_PE_MACHINE, got $peMachine"
          }
          $zigDirectory = $zigExecutables[0].Directory.FullName
          $zigDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $actualBytes = (Get-Item -LiteralPath $archive).Length
          [ordered]@{
            index_url = $indexUrl
            zig_version = $baseline
            platform = $env:ZIG_PLATFORM
            zig_pe_machine = $peMachine
            archive_url = $url
            expected_sha256 = $expectedSha256
            actual_sha256 = $actualSha256
            declared_bytes = [string] $artifact.size
            actual_bytes = $actualBytes
          } | ConvertTo-Json | Set-Content -Path (Join-Path $env:REVIEW_PACKET "zig-download.json") -Encoding utf8

      - name: Record the exact Windows host and Zig toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = (Get-Content -Raw -Path ".zig-version").Trim()
          $actual = (& zig version).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "zig version failed with exit code $LASTEXITCODE"
          }
          if ($actual -cne $expected) {
            throw "expected Zig $expected, got $actual"
          }

          $os = Get-CimInstance -ClassName Win32_OperatingSystem
          $nativeArchitecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($nativeArchitecture -cne $env:EXPECTED_OS_ARCH) {
            throw "expected OS architecture $env:EXPECTED_OS_ARCH, got $nativeArchitecture"
          }
          $versionKey = Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion"
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "git rev-parse failed with exit code $LASTEXITCODE"
          }
          [ordered]@{
            repository_commit = $commit
            runner_image = $env:ImageOS
            runner_image_version = $env:ImageVersion
            os_caption = $os.Caption
            os_version = $os.Version
            os_build_number = $os.BuildNumber
            os_architecture = $os.OSArchitecture
            native_os_architecture = $nativeArchitecture
            powershell_process_architecture = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
            zig_platform = $env:ZIG_PLATFORM
            windows_product_name = $versionKey.ProductName
            windows_display_version = $versionKey.DisplayVersion
            windows_current_build = $versionKey.CurrentBuild
            windows_update_build_revision = $versionKey.UBR
            windows_full_build = "$($versionKey.CurrentBuild).$($versionKey.UBR)"
            powershell_version = $PSVersionTable.PSVersion.ToString()
            zig_version = $actual
            processors = @(Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors)
            memory_bytes = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
            logical_disks = @(Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" | Select-Object DeviceID, FileSystem, Size)
            disk_models = @(Get-CimInstance Win32_DiskDrive | Select-Object Model, InterfaceType, Size)
          } | ConvertTo-Json | Tee-Object -FilePath (Join-Path $env:REVIEW_PACKET "host-and-toolchain.json")

          & zig env 2>&1 | Tee-Object -FilePath (Join-Path $env:REVIEW_PACKET "zig-env.txt")
          if ($LASTEXITCODE -ne 0) {
            throw "zig env failed with exit code $LASTEXITCODE"
          }

      - name: Run full exact-baseline verification
        shell: pwsh
        run: |
          & zig build verify --summary all 2>&1 | Tee-Object -FilePath (Join-Path $env:REVIEW_PACKET "zig-build-verify.log")
          if ($LASTEXITCODE -ne 0) {
            throw "zig build verify failed with exit code $LASTEXITCODE"
          }

      - name: Run Windows I/O mapping proof natively
        if: always()
        shell: pwsh
        run: |
          & zig test proofs/windows_io_mapping.zig 2>&1 | Tee-Object -FilePath (Join-Path $env:REVIEW_PACKET "windows-io-mapping-native.log")
          if ($LASTEXITCODE -ne 0) {
            throw "windows_io_mapping.zig failed with exit code $LASTEXITCODE"
          }

      - name: Run blocked-read cancellation proof natively
        if: always()
        shell: pwsh
        run: |
          & zig test proofs/threaded_blocked_read_cancel_windows.zig 2>&1 | Tee-Object -FilePath (Join-Path $env:REVIEW_PACKET "windows-blocked-read-cancel-native.log")
          if ($LASTEXITCODE -ne 0) {
            throw "threaded_blocked_read_cancel_windows.zig failed with exit code $LASTEXITCODE"
          }

      - name: Run APC batch and device cancellation proofs natively
        if: always()
        shell: pwsh
        run: |
          & zig test proofs/windows_apc_batch.zig 2>&1 | Tee-Object -FilePath (Join-Path $env:REVIEW_PACKET "windows-apc-batch-native.log")
          if ($LASTEXITCODE -ne 0) {
            throw "windows_apc_batch.zig failed with exit code $LASTEXITCODE"
          }

      - name: Run custom IOCP lifecycle and bounded workload natively
        if: always()
        shell: pwsh
        run: |
          & zig test proofs/windows_iocp_lifecycle.zig 2>&1 | Tee-Object -FilePath (Join-Path $env:REVIEW_PACKET "windows-iocp-lifecycle-native.log")
          if ($LASTEXITCODE -ne 0) {
            throw "windows_iocp_lifecycle.zig failed with exit code $LASTEXITCODE"
          }

      - name: Run TCP-to-file IOCP qualification natively
        if: always()
        shell: pwsh
        run: |
          & zig test proofs/windows_iocp_tcp_file.zig 2>&1 | Tee-Object -FilePath (Join-Path $env:REVIEW_PACKET "windows-iocp-tcp-file-native.log")
          if ($LASTEXITCODE -ne 0) {
            throw "windows_iocp_tcp_file.zig failed with exit code $LASTEXITCODE"
          }

      - name: Run all five x86 Windows proofs under WOW64 on the x64 host
        if: always() && matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -cne "X64") {
            throw "this WOW64 evidence gate requires an x64 Windows host"
          }
          $proofs = @(
            "windows_io_mapping",
            "threaded_blocked_read_cancel_windows",
            "windows_apc_batch",
            "windows_iocp_lifecycle",
            "windows_iocp_tcp_file"
          )
          $binaryDirectory = Join-Path $env:RUNNER_TEMP "zig-wiki-wow64"
          New-Item -ItemType Directory -Force -Path $binaryDirectory | Out-Null
          $results = @()
          foreach ($proof in $proofs) {
            $binary = Join-Path $binaryDirectory "$proof.exe"
            $compileLog = Join-Path $env:REVIEW_PACKET "$proof-x86-compile.log"
            $runtimeLog = Join-Path $env:REVIEW_PACKET "$proof-wow64-runtime.log"
            # Exact Zig 0.16 --test-no-exec links the test without executing it.
            # The following explicit process launch supplies the runtime evidence.
            Set-Content -Path $compileLog -Value "zig test proofs/$proof.zig -target x86-windows -femit-bin=$binary --test-no-exec" -Encoding utf8
            & zig test "proofs/$proof.zig" -target x86-windows "-femit-bin=$binary" --test-no-exec 2>&1 | Tee-Object -FilePath $compileLog -Append
            if ($LASTEXITCODE -ne 0) {
              throw "$proof x86 compilation failed with exit code $LASTEXITCODE"
            }
            $binaryBytes = [IO.File]::ReadAllBytes($binary)
            $peOffset = [BitConverter]::ToInt32($binaryBytes, 0x3c)
            if ([BitConverter]::ToUInt16($binaryBytes, 0) -ne 0x5a4d -or
                [BitConverter]::ToUInt32($binaryBytes, $peOffset) -ne 0x4550 -or
                [BitConverter]::ToUInt16($binaryBytes, $peOffset + 4) -ne 0x014c -or
                [BitConverter]::ToUInt16($binaryBytes, $peOffset + 24) -ne 0x010b) {
              throw "$proof is not an x86 PE32 executable"
            }
            & $binary 2>&1 | Tee-Object -FilePath $runtimeLog
            $runtimeExit = $LASTEXITCODE
            $results += [ordered]@{
              proof = "proofs/$proof.zig"
              target = "x86-windows"
              executable_pe_machine = "014c"
              executable_sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
              host_os_architecture = "X64"
              execution = "x86 process under WOW64 on x64 Windows; not a 32-bit Windows OS"
              runtime_exit_code = $runtimeExit
            }
            ConvertTo-Json -InputObject @($results) | Set-Content -Path (Join-Path $env:REVIEW_PACKET "wow64-results.json") -Encoding utf8
            if ($runtimeExit -ne 0) {
              throw "$proof WOW64 runtime failed with exit code $runtimeExit"
            }
          }

      - name: Run command and retrieval gates
        shell: pwsh
        run: |
          & python3 -m unittest tools.test_wiki_commands tools.test_retrieval_benchmark tools.test_curate_review tools.test_curate_scheduled -v 2>&1 | Tee-Object -FilePath (Join-Path $env:REVIEW_PACKET "command-tests.log")
          if ($LASTEXITCODE -ne 0) {
            throw "command tests failed with exit code $LASTEXITCODE"
          }
          & python3 tools/retrieval_benchmark.py --format text --enforce-policy 2>&1 | Tee-Object -FilePath (Join-Path $env:REVIEW_PACKET "retrieval-benchmark.log")
          if ($LASTEXITCODE -ne 0) {
            throw "retrieval policy failed with exit code $LASTEXITCODE"
          }

      - name: Record checkout status
        if: always()
        shell: pwsh
        run: |
          $checkoutStatus = @(& git status --porcelain --untracked-files=all 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw "git status failed with exit code $LASTEXITCODE"
          }
          $statusText = $checkoutStatus -join "`n"
          Set-Content -Path (Join-Path $env:REVIEW_PACKET "repository-status.txt") -Value $statusText -Encoding utf8
          if ($statusText.Trim()) {
            Write-Output $statusText
            throw "verification modified the checkout"
          }

      - name: Upload Windows runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zig-wiki-windows-runtime-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zig-wiki-windows-runtime
          if-no-files-found: error
          retention-days: 30
